name: Naukri Daily Profile Updater

on:
  schedule:
    # 10:00 AM IST is 4:30 AM UTC (IST is UTC+5:30)
    - cron: '30 4 * * *'
  workflow_dispatch:
    # Allows manual trigger of the script from GitHub Actions dashboard

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies for faster runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Profile Updater
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: python updater.py

      - name: Upload Error Screenshot (on Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: error-screenshot
          path: naukri_error_screenshot.png
          if-no-files-found: ignore
          retention-days: 7
